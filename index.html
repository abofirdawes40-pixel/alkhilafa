<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الخلافة - طنجة والمضيق</title>
<style>
body{margin:0;background:#0a1628;color:#fff;font-family:sans-serif;overflow:hidden}
#map{position:relative;width:100vw;height:62vh;background:linear-gradient(#2e86de,#0a3d62);border-bottom:4px solid #f1c40f}
.city{position:absolute;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;cursor:pointer;border:3px solid #fff;text-align:center;font-size:13px;box-shadow:0 0 10px gold}
.city.conquered{background:radial-gradient(#26de81,#20bf6b);color:#fff}
#tanja{top:4%;left:4%;background:radial-gradient(#ff7979,#eb4d4b);color:#fff;width:80px;height:80px;border-color:gold}
#mdiq{top:2%;left:35%;background:radial-gradient(#7ed6df,#22a6b3);color:#fff;width:65px;height:65px}
#tulaytula{top:12%;right:8%}#ishbiliya{top:22%;left:26%}#gharnata{top:45%;right:12%}#qurtuba{bottom:10%;left:20%}
#log{height:20vh;background:#0f172a;padding:10px;overflow-y:auto;font-size:14px;line-height:1.6}
#controls{height:18vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1e293b;gap:6px}
#stats{display:flex;gap:12px;color:#f1c40f;font-weight:bold;font-size:14px}
button{background:#f1c40f;color:#000;border:none;padding:12px 28px;border-radius:25px;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div id="map">
<div class="city" id="tanja" onclick="attack('طنجة',this)">طنجة</div>
<div class="city" id="mdiq" onclick="attack('المضيق',this)">المضيق</div>
<div class="city" id="tulaytula" onclick="attack('طليطلة',this)">طليطلة</div>
<div class="city" id="ishbiliya" onclick="attack('إشبيلية',this)">إشبيلية</div>
<div class="city" id="gharnata" onclick="attack('غرناطة',this)">غرناطة</div>
<div class="city" id="qurtuba" onclick="attack('قرطبة',this)">قرطبة</div>
</div>
<div id="log">🏴 مرحبا يا خليفة طنجة! ابدأ الفتح من مدينتك طنجة ثم المضيق!</div>
<div id="controls"><div id="stats"><span id="gold">ذهب:200</span><span id="soldiers">جنود:20</span><span id="conq">فتح:0/6</span></div><button onclick="recruit()">➕ جند (50 ذهب)</button></div>
<script>
let gold=200,soldiers=20,conquered=0;
let logEl=document.getElementById('log'),goldEl=document.getElementById('gold'),soldEl=document.getElementById('soldiers'),conqEl=document.getElementById('conq');
function update(){goldEl.textContent='ذهب:'+gold;soldEl.textContent='جنود:'+soldiers;conqEl.textContent='فتح:'+conquered+'/6'}
function addLog(t){logEl.innerHTML='✅ '+t+'<br>'+logEl.innerHTML}
function attack(name,el){if(el.classList.contains('conquered')){addLog(name+' مفتوحة!');return}if(soldiers<5){addLog('خاصك جنود!');return}soldiers-=2;if(Math.random()>0.25){el.classList.add('conquered');conquered++;gold+=120;addLog('⚔️ فتحت '+name+'! +120 ذهب');if(conquered>=6)addLog('🎉 مبروك فتحت من طنجة للأندلس!')}else addLog('💔 فشل '+name);update()}
function recruit(){if(gold>=50){gold-=50;soldiers+=20;addLog('جندت 20');}else addLog('ماعندكش ذهب:'+gold);update()}update();
</script>
</body>
</html>
