<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قلعة طارق - اللعبة الكاملة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050a12;color:#fff;font-family:system-ui;text-align:center;padding:0 0 70px}
.nav{position:sticky;top:0;z-index:100;background:#0a0f1a;padding:8px;display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid #1a2a1a}
.btn{padding:8px 12px;border-radius:12px;border:2px solid #2e8b57;background:linear-gradient(90deg,#1a5a2a,#0f3a1a);color:#fff;font-weight:900;font-size:12px;white-space:nowrap;cursor:pointer}
.btn.active{background:linear-gradient(90deg,#c9a44a,#8a6a1a);border-color:#ffdd57;color:#000}
.view{display:none;padding:10px} .view.active{display:block}
img.main{width:100%;max-width:500px;border-radius:18px;border:3px solid #2e8b57}
.header{display:flex;justify-content:space-between;align-items:center;background:#111;padding:8px 12px;border-bottom:2px solid #333;font-size:12px}
.tabs{display:flex;gap:5px;padding:8px;background:#0f0f23;overflow-x:auto}
.tab{padding:6px 12px;border-radius:20px;border:1px solid #444;background:#1a1a33;font-size:12px;white-space:nowrap}
.tab.active{background:linear-gradient(90deg,#c9a44a,#8a6a1a);color:#000;font-weight:900}
.rarity{padding:10px 12px;font-weight:900;font-size:13px;text-align:left}
.gold{color:#ffdd57} .purple{color:#c87aff} .blue{color:#5ac8ff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border-radius:12px;padding:6px 3px;text-align:center;position:relative;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.card.gold-card{background:linear-gradient(180deg,#c9a44a,#5a4010);border:2px solid #ffdd57}
.card.purple-card{background:linear-gradient(180deg,#8a4acc,#3a1a5a);border:2px solid #c87aff}
.card.blue-card{background:linear-gradient(180deg,#2a6a9a,#0a2a4a);border:2px solid #5ac8ff}
.card b{font-size:9px;line-height:1.1;display:block} .card span{font-size:8px;line-height:1} .stars{font-size:10px;color:#ffdd57}
.icon{font-size:28px;margin:4px 0}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:500px;margin:10px auto}
.city-card{background:linear-gradient(145deg,#1c3320,#0e1f10);border:2px solid #2a5a2a;border-radius:12px;padding:10px;font-size:13px}
</style>
</head>
<body>

<div class="header"><span>👑 قلعة طارق</span><span>💎 12,345 🪙 98,423</span></div>

<div class="nav">
<button class="btn active" id="b-outside" onclick="show('outside')">🏰 القلعة</button>
<button class="btn" id="b-inside" onclick="show('inside')">🏘️ المدينة</button>
<button class="btn" id="b-map" onclick="show('map')">🗺️ الخريطة</button>
<button class="btn" id="b-heroes" onclick="show('heroes')">👑 الأبطال 15</button>
<button class="btn" id="b-army" onclick="show('army')">⚔️ الجيش</button>
</div>

<!-- 1. القلعة -->
<div id="outside" class="view active">
<h2 style="color:#7aff7a">🏰 قلعة طارق - من الخارج</h2>
<img class="main" src="castle.jpg" onclick="show('inside')">
<p>قلعة حمراء بقبة خضراء - برك للدخول</p>
<button class="btn" onclick="show('inside')">🚪 دخول المدينة</button>
<button class="btn" onclick="show('map')">🗺️ خريطة الفتح</button>
</div>

<!-- 2. المدينة -->
<div id="inside" class="view">
<h2 style="color:#7aff7a">🏰 داخل القلعة</h2>
<img class="main" src="inside.jpg">
<div class="city-grid">
<div class="city-card">🕌 قصر الخلافة<br>Lv24</div>
<div class="city-card">🛡️ الثكنة<br>Lv20</div>
<div class="city-card">📚 بيت الحكمة<br>Lv19</div>
<div class="city-card">🏪 السوق<br>Lv18</div>
<div class="city-card">🏥 المارستان<br>Lv17</div>
<div class="city-card">🐴 الإسطبل<br>Lv15</div>
</div>
<button class="btn" onclick="show('outside')">🚪 خروج</button>
<button class="btn" onclick="show('heroes')">👑 الأبطال</button>
</div>

<!-- 3. الخريطة -->
<div id="map" class="view">
<h2 style
