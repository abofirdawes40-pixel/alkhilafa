<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حرب المدن الخمس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1a;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e3a5f;border-bottom:2px solid #c9a44a;display:flex;justify-content:space-between;padding:6px 8px;font-size:11px}
#game{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto} .view.active{display:block}
.city-bg{min-height:600px;background:radial-gradient(#2a5a2a,#0f2a0f);padding:10px}
.build-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:20px auto}
.bcard{background:linear-gradient(145deg,#2a3a4a,#1a2a3a);border:2px solid #c9a44a;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.bcard.locked{opacity:.5}
.world-wrap{position:relative;max-width:800px;margin:auto} .world-wrap img{width:100%}
.city-pin{position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 15px #000}
.city-pin.jabal{width:70px;height:70px;border-color:#ffd700;background:radial-gradient(#ffdd57,#b8860b);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 20px #ffd700}50%{box-shadow:0 0 30px gold}}
.army-dot{position:absolute;width:28px;height:28px;background:red;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10}
.bottombar{height:56px;background:#000;border-top:2px solid #c9a44a;display:flex;justify-content:space-around;align-items:center}
.bbtn{background:none;border:none;color:#888;font-size:11px;cursor:pointer} .bbtn.active{color:#ffdd57} .bbtn .i{font-size:22px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100} .modal.on{display:flex}
.mbox{background:#2a3a5a;border:2px solid #c9a44a;border-radius:16px;padding:16px;max-width:360px;width:100%}
.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px} .btn-gold{background:linear-gradient(#ffdd57,#c9a44a)} .btn-red{background:linear-gradient(#ff4444,#8b0000);color:#fff}
</style>
</head>
<body>
<div class="topbar"><div>🪵 <b id="wood">500</b> 🌾 <b id="food">500</b> 🪙 <b id="gold">1000</b></div><div>⚔️ <b id="legionPower">100</b></div></div>
<div id="game">
<div id="vCity" class="view active"><div class="city-bg"><h2 style="text-align:center;color:#ffdd57">🏰 مدينتك</h2><div class="build-grid" id="buildGrid"></div><div style="text-align:center"><button class="btn btn-gold" style="max-width:200px" onclick="createLegion()">⚔️ فيلق جديد +100</button></div></div></div>
<div id="vWorld" class="view"><div class="world-wrap" id="worldWrap"><img src="world_map.jpg"><div class="city-pin jabal" style="left:50%;top:42%" onclick="openCity('jabal')">🏔️</div><div class="city-pin" style="left:22%;top:38%;background:#4a8" onclick="openCity('algeciras')">⚓</div><div class="city-pin" style="left:72%;top:32%;background:#a84" onclick="openCity('cordoba')">🕌</div><div class="city-pin" style="left:35%;top:82%;background:#48a;border-color:gold" onclick="openCity('tangier')">🏠</div><div class="city-pin" style="left:75%;top:85%;background:#888" onclick="openCity('ceuta')">🏰</div><div id="armyLayer" style="position:absolute;inset:0;pointer-events:none"></div></div><p style="text-align:center;color:#ffdd57;font-size:11px">برك على مدينة باش تصيفط الفيلق لجبل طارق</p></div>
</div>
<div class="bottombar"><button class="bbtn active" onclick="showView('vCity',this)"><span class="i">🏘️</span>مدينتي</button><button class="bbtn" onclick="showView('vWorld',this)"><span class="i">🗺️</span>الخريطة</button><button class="bbtn" onclick="alert('قريبا')"><span class="i">👑</span>الفيلق</button></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeModal()"><div class="mbox" id="mbox"></div></div>
<script>
let res={wood:500,food:500,gold:1000},legion={power:100,x:35,y:82}
let buildings=[{id:'palace',name:'القصر',ico:'🏰',lvl:1,cost:{wood:0,gold:0}},{id:'barracks',name:'الثكنة',ico:'⚔️',lvl:0,cost:{wood:100,gold:50}},{id:'wall',name:'السور',ico:'🧱',lvl:0,cost:{wood:80,gold:80}},{id:'market',name:'السوق',ico:'🛒',lvl:0,cost:{wood:60,gold:40}},{id:'farm',name:'المزرعة',ico:'🌾',lvl:0,cost:{wood:40,gold:20}},{id:'mine',name:'المنجم',ico:'⛏️',lvl:0,cost:{wood:70,gold:60}}]
function renderBuilds(){let g=document.getElementById('buildGrid');g.innerHTML='';buildings.forEach(b=>{let can=res.wood>=b.cost.wood&&res.gold>=b.cost.gold;let d=document.createElement('div');d.className='bcard'+(b.lvl==0&&!can?' locked':'');d.innerHTML=`<div style="font-size:32px">${b.ico}</div><div>${b.name}</div><div style="font-size:10px;color:#ffdd57">LV.${b.lvl}</div>`;d.onclick=()=>upgrade(b.id);g.appendChild(d)});updateRes()}
function upgrade(id){let b=buildings.find(x=>x.id==id);if(b.lvl==0){if(res.wood<b.cost.wood||res.gold<b.cost.gold){alert('موارد ناقصة');return}res.wood-=b.cost.wood;res.gold-=b.cost.gold}b.lvl++;renderBuilds()}
function updateRes(){document.getElementById('wood').textContent=res.wood;document.getElementById('food').textContent=res.food;document.getElementById('gold').textContent=res.gold;document.getElementById('legionPower').textContent=legion.power}
function createLegion(){if(res.food<100||res.gold<100){alert('خاصك 100🌾 و 100🪙');return}res.food-=100;res.gold-=100;legion.power+=100;updateRes();alert('فيلق جديد! القوة: '+legion.power)}
function showView(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function openCity(c){let n={jabal:'جبل طارق',algeciras:'الجزيرة',cordoba:'قرطبة',tangier:'طنجة',ceuta:'سبتة'};document.getElementById('mbox').innerHTML=`<h3>${n[c]}</h3><button class="btn btn-red" onclick="sendLegion('${c}');closeModal()">⚔️ صيفط الفيلق</button><button class="btn" style="background:#333;color:#fff" onclick="closeModal()">إلغاء</button>`;document.getElementById('modal').classList.add('on')}
let posMap={jabal:{x:50,y:42},algeciras:{x:22,y:38},cordoba:{x:72,y:32},tangier:{x:35,y:82},ceuta:{x:75,y:85}}
function sendLegion(city){let t=posMap[city];let l=document.getElementById('armyLayer');l.innerHTML=`<div class="army-dot" id="armyDot" style="left:${legion.x}%;top:${legion.y}%">⚔️</div>`;let dot=document.getElementById('armyDot');let steps=20,i=0,dx=(t.x-legion.x)/steps,dy=(t.y-legion.y)/steps;let it=setInterval(()=>{i++;legion.x+=dx;legion.y+=dy;dot.style.left=legion.x+'%';dot.style.top=legion.y+'%';if(i>=steps){clearInterval(it);battle(city)}},80)}
function battle(city){if(city=='tangier'){alert('هادي مدينتك');return}let en=city=='jabal'?300:150;if(legion.power>=en){alert('انتصار! سيطرت على جبل طارق! +500 ذهب');res.gold+=500;legion.power-=30}else{alert('هزيمة! كبر الفيلق');legion.power=Math.max(10,legion.power-50)}updateRes();document.getElementById('armyLayer').innerHTML=''}
function closeModal(){document.getElementById('modal').classList.remove('on')}
renderBuilds()
</script>
</body>
</html>
