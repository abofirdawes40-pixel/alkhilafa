<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>عرش الخلافة - بناء القلعة</title><style>body{margin:0;background:#0a1931;color:#fff;font-family:Tahoma;overflow-x:hidden}.top-bar{position:fixed;top:0;left:0;right:0;background:linear-gradient(#1e293b,#0f172a);padding:10px;border-bottom:3px solid gold;display:flex;justify-content:space-around;font-weight:bold;z-index:1000;font-size:13px}.map{margin-top:55px;position:relative;width:100%;height:60vh;background:radial-gradient(circle at 30% 30%,#1e3a8a,#0a1931 70%);overflow:hidden}.city{position:absolute;width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 0 12px gold;border:3px solid #fff;font-size:12px;transition:0.2s}.city:active{transform:scale(0.9)}.city.green{background:radial-gradient(#22c55e,#16a34a);border-color:gold}.city.red{background:radial-gradient(#ef4444,#991b1b)}.city.cyan{background:radial-gradient(#22d3ee,#0891b2)}.city.orange{background:radial-gradient(#f97316,#9a3412)}.city.owned{border-color:#fbbf24;box-shadow:0 0 18px gold}.lvl{position:absolute;top:-8px;right:-8px;background:gold;color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:2px solid #fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:8px;border-top:3px solid gold;z-index:50}.build-menu{position:fixed;bottom:95px;left:5%;right:5%;background:linear-gradient(#1e293b,#0f172a);border:3px solid gold;border-radius:15px;padding:12px;z-index:999;display:none}.b-card{background:#334155;border:2px solid #475569;border-radius:10px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}.b-btn{padding:6px 12px;border:none;border-radius:15px;font-weight:bold;cursor:pointer;color:#fff}.evBar{display:flex;gap:6px;justify-content:center;margin-top:6px}.evBtn{padding:7px 12px;border:none;border-radius:18px;font-weight:bold;cursor:pointer;color:#fff;font-size:12px}.camp{position:absolute;width:58px;height:58px;background:radial-gradient(red,darkred);border-radius:50%;border:3px solid yellow;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;z-index:900;cursor:pointer;animation:pulse 0.8s infinite;color:#fff;font-weight:bold}.castle-ev{position:absolute;width:62px;height:62px;background:radial-gradient(#7c2d12,#000);border-radius:12px;border:3px solid gold;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;z-index:899;cursor:pointer;color:gold;font-weight:bold}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}</style></head><body><div class="top-bar"><span>💰 <b id="gold">500</b></span><span>🪵 <b id="wood">300</b></span><span>🪨 <b id="stone">200</b></span><span>🏰 <b id="castles">1/8</b></span></div><div class="map" id="map"><div class="city green owned" id="c-tanja" style="left:6%;top:10%" onclick="openBuild('طنجة','tanja',true)"><div class="lvl" id="l-tanja">1</div>طنجة<br>🏰</div><div class="city red" id="c-sebta" style="left:43%;top:14%" onclick="openBuild('سبتة','sebta',false)">سبتة</div><div class="city cyan" id="c-madiq" style="left:23%;top:32%" onclick="openBuild('المضيق','madiq',false)">المضيق</div><div class="city red" id="c-tarif" style="left:53%;top:38%" onclick="openBuild('طريف','tarif',false)">طريف</div><div class="city orange" id="c-ish" style="left:6%;top:48%" onclick="openBuild('إشبيلية','ish',false)">إشبيلية</div><div class="city orange" id="c-tul" style="left:73%;top:20%" onclick="openBuild('طليطلة','tul',false)">طليطلة</div><div class="city orange" id="c-ghar" style="left:69%;top:56%" onclick="openBuild('غرناطة','ghar',false)">غرناطة</div><div class="city orange" id="c-qur" style="left:19%;top:70%" onclick="openBuild('قرطبة','qur',
