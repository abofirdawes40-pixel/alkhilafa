<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخلافة V2</title><style>@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap');*{box-sizing:border-box}body{margin:0;background:#06101f;color:#fff;font-family:Amiri;overflow:hidden}#map{position:relative;width:100vw;height:65vh;background:radial-gradient(ellipse at top,#1e5fad 0%,#0a2a5a 60%,#061a3a 100%);border-bottom:4px solid gold;overflow:hidden}.city{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;border:3px solid #fff;text-align:center;font-size:13px;box-shadow:0 0 15px gold;transition:.3s;z-index:2}.city.conquered{background:radial-gradient(#26de81,#20bf6b)!important;border-color:gold;box-shadow:0 0 20px #26de81}#tanja{top:6%;left:5%;width:88px;height:88px;background:radial-gradient(#ff6b6b,#c0392b);border-color:gold;animation:pulse 2s infinite}#sebt{top:8%;left:38%;width:68px;height:68px;background:radial-gradient(#f8c291,#e55039);font-size:12px}#mdiq{top:22%;left:22%;width:68px;height:68px;background:radial-gradient(#7ed6df,#22a6b3)}#tarif{top:28%;left:48%;width:62px;height:62px;background:radial-gradient(#e77f67,#b71540);font-size:11px}#tulaytula{top:14%;right:6%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}#ishbiliya{top:32%;left:5%;width:70px;height:70px;background:radial-gradient(#ffa502,#ff6348);color:#000}#qurtuba{bottom:22%;left:18%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}#gharnata{bottom:38%;right:10%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}@keyframes pulse{0%{box-shadow:0 0 0 0 gold}70%{box-shadow:0 0 0 15px rgba(255,215,0,0)}100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}}#log{height:18vh;background:#0f172a;padding:8px 10px;overflow-y:auto;font-size:13px;line-height:1.7;border-top:2px solid #1e293b}#controls{height:17vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1e293b;gap:6px}#stats{display:flex;gap:10px;color:gold;font-weight:bold;font-size:13px}button{background:linear-gradient(gold,#f39c12);color:#000;border:none;padding:10px 22px;border-radius:25px;font-weight:bold;font-size:14px;cursor:pointer}#victory{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;text-align:center;padding:20px}#victory h1{color:gold;font-size:28px}</style></head><body><div id="map"><div class="city" id="tanja" onclick="attack('طنجة',this,0)">طنجة<br>🏰</div><div class="city" id="sebt" onclick="attack('سبتة',this,1)">سبتة</div><div class="city" id="mdiq" onclick="attack('المضيق',this,1)">المضيق</div><div class="city" id="tarif" onclick="attack('طريف',this,2)">طريف</div><div class="city" id="tulaytula" onclick="attack('طليطلة',this,3)">طليطلة</div><div class="city" id="ishbiliya" onclick="attack('إشبيلية',this,3)">إشبيلية</div><div class="city" id="gharnata" onclick="attack('غرناطة',this,4)">غرناطة</div><div class="city" id="qurtuba" onclick="attack('قرطبة',this,4)">قرطبة</div></div><div id="log">🏴 بسم الله! أنت في طنجة. ابدأ بفتح سبتة والمضيق!</div><div id="controls"><div id="stats"><span id="gold">ذهب:300</span><span id="soldiers">جنود:30</span><span id="conq">فتح:1/8</span></div><div style="display:flex;gap:8px"><button onclick="recruit()">+ جند (50)</button><button onclick="buildMosque()" style="background:linear-gradient(#26de81,#20bf6b);color:#fff">🕌 مسجد (100)</button></div></div><div id="victory"><h1>🎉 الله أكبر! فتح مبين 🎉</h1><p>فتحت 8 مدن من طنجة للأندلس! طارق بن زياد فخور بك!</p><button onclick="location.reload()">🔄 العب مرة أخرى</button></div><script>let gold=300,soldiers=30,conquered=1,mosques=0,tanjaEl=document.getElementById('tanja');tanjaEl.classList.add('conquered');let logEl=document.getElementById('log'),goldEl=document.getElementById('gold'),soldEl=document.getElementById('soldiers'),conqEl=document.getElementById('conq');function update(){goldEl.textContent='ذهب:'+gold;soldEl.textContent='جنود:'+soldiers;conqEl.textContent='فتح:'+conquered+'/8 🕌:'+mosques}function addLog(t){logEl.innerHTML='✅ '+t+'<br>'+logEl.innerHTML}function attack(name,el,level){if(el.classList.contains('conquered')){addLog(name+' مفتوحة');return}if(level>1&&conquered<3){addLog('⚠️ افتح سبتة والمضيق أولا قبل '+name);return}if(level>2&&conquered<4){addLog('⚠️ افتح طريف أولا!');return}if(soldiers<5){addLog('خاصك جنود!');return}soldiers-=3;let chance=.7+mosques*.05;if(Math.random()<chance){el.classList.add('conquered');conquered++;gold+=150;addLog('⚔️ فتحت '+name+'! +150 ذهب');if(conquered>=8)document.getElementById('victory').style.display='flex'}else addLog('💔 فشل هجوم '+name);update()}function recruit(){if(gold>=50){gold-=50;soldiers+=25;addLog('🪖 جندت 25 فارس')}else addLog('ماعندكش ذهب');update()}function buildMosque(){if(gold>=100){gold-=100;mosques++;addLog('🕌 بنيت مسجد! +5% نصر')}else addLog('المسجد ب 100');update()}update();</script></body></html>
