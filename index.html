<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>عرش الخلافة</title><style>body{margin:0;background:#0a1931;color:#fff;font-family:Tahoma;height:100vh;overflow:hidden}.map{position:relative;width:100%;height:75vh;background:radial-gradient(circle,#1e3a8a,#0a1931)}.city{position:absolute;width:85px;height:85px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 0 12px gold;border:3px solid #fff}.city.green{background:#22c55e;border-color:gold}.city.red{background:#ef4444}.city.cyan{background:#22d3ee}.city.orange{background:#f97316}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:8px;border-top:3px solid gold;text-align:center}.camp{position:absolute;width:60px;height:60px;background:radial-gradient(red,darkred);border-radius:50%;border:3px solid yellow;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:99;cursor:pointer;animation:pulse 1s infinite}@keyframes pulse{0%{scale:1}50%{scale:1.1}100%{scale:1}}</style></head><body><div class="map" id="map"><div class="city green" style="left:5%;top:8%">طنجة<br>🏰</div><div class="city red" style="left:42%;top:12%">سبتة</div><div class="city cyan" style="left:22%;top:32%">المضيق</div><div class="city red" style="left:52%;top:38%">طريف</div><div class="city orange" style="left:5%;top:45%">إشبيلية</div><div class="city orange" style="left:72%;top:22%">طليطلة</div><div class="city orange" style="left:68%;top:60%">غرناطة</div><div class="city orange" style="left:18%;top:72%">قرطبة</div><div id="evLayer"></div></div><div class="bottom"><div style="border-top:2px solid gold;padding:5px">🏴 بسم الله! أنت في طنجة. ابدأ بفتح سبتة والمضيق!</div><div style="color:#fbbf24;font-weight:bold;margin-top:5px">ذهب: <span id="gold">300</span> | جنود: 30 | فتح: 1/8 | 🕌:0</div><button id="evBtn" style="margin-top:8px;padding:10px 20px;background:orange;color:#fff;border:none;border-radius:10px;font-weight:bold">🎯 فتح حدث المطاردة</button></div><script>let gold=300;document.getElementById('evBtn').onclick=function(){let power=1000,level=1;alert('🎯 بدأ! غادي ينزل معسكر ⛺ برك عليه');function spawn(){const c=document.createElement('div');c.className='camp';c.style.left=(Math.random()*70+10)+'%;';c.style.top=(Math.random()*50+10)+'%;';c.innerHTML='⛺';c.onclick=function(){power-=300;gold+=level*10;document.getElementById('gold').innerText=gold;if(power<=0){this.remove();if(level==1)alert('🥇 الضربة الأولى!');level++;power=1000*level;if(level<=10)spawn();else alert('🏆 سالا - الترتيب 1-50 ربحو والتحالف Top 3');}else{this.innerHTML=power;}};document.getElementById('evLayer').appendChild(c);}spawn();};</script></body></html>
