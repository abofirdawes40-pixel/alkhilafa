<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرش الخلافة - طارق بن زياد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1931;color:#fff;font-family:Tahoma;padding-bottom:90px}
.top{position:fixed;top:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;justify-content:space-around;font-weight:bold;z-index:100;border-bottom:3px solid gold;font-size:13px}
.map{margin-top:55px;width:100%;height:62vh;background:radial-gradient(circle at center,#1e3a8a,#0a1931);position:relative;border-bottom:3px solid gold}
.city{position:absolute;width:85px;height:85px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;border:3px solid #fff;box-shadow:0 0 15px gold;font-size:13px}
.c-green{background:#22c55e;left:6%;top:10%}
.c-red1{background:#ef4444;left:42%;top:14%}
.c-orange1{background:#f97316;left:72%;top:22%}
.c-cyan{background:#06b6d4;left:22%;top:33%}
.c-red2{background:#ef4444;left:54%;top:42%}
.c-orange2{background:#f97316;left:6%;top:50%}
.c-orange3{background:#f97316;left:70%;top:62%}
.c-orange4{background:#f97316;left:20%;top:75%}
.enter{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:linear-gradient(gold,#f59e0b);color:#000;padding:16px 30px;border-radius:25px;font-weight:bold;font-size:20px;border:4px solid #fff;z-index:2000;box-shadow:0 0 30px gold;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale
