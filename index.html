<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرش الخلافة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a1430;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.top{ background:#131a3a;padding:12px;display:flex;justify-content:space-around;font-weight:900;border-radius:0 0 18px 18px}
.map{flex:1;position:relative;background:radial-gradient(circle,#1e3a8a,#0a1430);padding:10px}
.city{position:absolute;width:88px;height:88px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.tangier{top:5%;left:8%;border-color:#22ff88;background:#22ff8822;box-shadow:0 0 20px #22ff88}
.ceuta{top:5%;right:8%;border-color:#ff4444;background:#ff444422}
.toledo{top:32%;left:3%;border-color:#ffaa22;background:#ffaa2222}
.strait{top:32%;right:3%;border-color:#44ddff;background:#44ddff22}
.seville{top:52%;left:3%;border-color:#ffaa22;background:#ffaa2222}
.granada{top:74%;left:12%;border-color:#ffaa22;background:#ffaa2222}
.cordoba{top:74%;right:12%;border-color:#ffaa22;background:#ffaa2222}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:170px;height:120px;background:linear-gradient(#ffcc33,#ff9900);border-radius:18px;color:#3d2200;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900;box-shadow:0 5px 0 #b36b00}
.bottom{background:#0f1535;border-radius:18px 18px 0 0;padding:10px}
.hint{text-align:center;color:#8ab4ff;font-size:13px;margin-bottom:8px}
.stats{display:flex;justify-content:space-around;background:#0a0e2a;border-radius:10px;padding:8px;font-size:12px;margin-bottom:8px}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:12px;text-align:center;font-weight:900;cursor:pointer}
.b1{background:#ff4444} .b2{background:#22aa44} .b3{background:#ffaa00;color:#3d2200}
</style>
</head>
<body>
<div class="top"><span>🏰 1/8</span><span>🌾 300</span><span>🪨 400</span><span>🪵 500</span><span>💰 800</span></div>
<div class="map">
<div class="city tangier">🏰<br>Tangier</div>
<div class="city ceuta">🏰<br>Ceuta</div>
<div class="city toledo">🏰<br>Toledo</div>
<div class="city strait">🌊<br>Strait</div>
<div class="city seville">🏰<br>Seville</div>
<div class="city granada">🕌<br>Granada</div>
<div class="city cordoba">🕌<br>Cordoba</div>
<div class="center" onclick="alert('دخلتي قلعة طنجة! المسنطحة رجعات 😎')">🏰<br>دخول القلعة</div>
</div>
<div class="bottom">
<div class="hint">اختر مدينة للتحرك أو اجمع الموارد قبل الدخول</div>
<div class="stats"><span>⭐ المستوى: 7</span><span>💎 النقاط: 1240</span><span>🪖 الجنود: 42</span></div>
<div class="btns">
<div class="btn b1" onclick="alert('مطاردة البرتغاليين!')">مطاردة</div>
<div class="btn b2" onclick="alert('جمعت +50 موارد!')">جمع</div>
<div class="btn b3" onclick="alert('دخول القلعة!')">دخول القلعة</div>
</div>
</div>
</body>
</html>
