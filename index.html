<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الخلافة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma;background:#f0f2f5;padding:15px}
.card{max-width:650px;margin:auto;background:#fff;border-radius:12px;padding:20px}
h1{text-align:center;color:#0d6e3f}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
label{display:block;font-weight:bold;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hidden{display:none}
.req{background:#fff7e6;border-right:4px solid orange;padding:6px;font-size:12px;margin:8px 0}
.btn{width:100%;background:#0d6e3f;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;margin-top:15px}
.ok{background:#e8f5e9;padding:10px;text-align:center;display:none;margin-top:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h1>🕌 الخلافة - تسجيل</h1>
<p class="sub">جميع الحقول الـ29 مطلوبة</p>
<form id="f">
<label>1- الاسم الكامل *</label><input name="fullName" required>
<div class="row"><div><label>2- الكنية *</label><input name="kunya" required></div><div><label>3- العمر *</label><input type="number" name="age" required></div></div>
<label>4- الجنسية الحالية *</label><input name="nationality" required>
<div class="row"><div><label>5- الأصلية *</label><input name="origNat" required></div><div><label>6- بلد الإقامة *</label><input name="residence" required></div></div>
<label>7- مكان الإقامة الأصلي *</label><input name="origPlace" required>
<label>8- المهارة *</label><input name="skill" required>
<label>9- المستوى العلمي *</label><select name="education" required><option value="">اختر</option><option>ابتدائي</option><option>إعدادي</option><option>ثانوي</option><option>جامعي</option><option>ماجستير</option><option>دكتوراه</option></select>
<label>10- الحالة الاجتماعية *</label><select name="marital" id="marital" required><option value="">اختر</option><option value="أعزب">أعزب</option><option value="متزوج">متزوج</option><option value="مطلق">مطلق</option><option value="أرمل">أرمل</option></select>
<div id="maritalBox" class="hidden"><div class="req">بيانات الزوجة والأولاد</div><div class="row"><div><label>عدد الزوجات</label><input type="number" name="wivesCount"></div><div><label>عدد الأولاد</label><input type="number" name="kidsCount"></div></div><textarea name="familyNames" rows="2" placeholder="الأسماء والأعمار"></textarea></div>
<label>11- العمل الحالي *</label><input name="job" required>
<label>12- مكان العمل *</label><input name="jobPlace" required>
<label>13- تعمل مع جماعة؟ *</label><select name="withGroup" id="withGroup" required><option value="">اختر</option><option value="لا">لا</option><option value="نعم">نعم</option></select>
<div id="groupBox" class="hidden"><input name="groupName" placeholder="اسم الجماعة"><input name="groupRole" placeholder="دورك" style="margin-top:5px"></div>
<label>14- بايعت من قبل؟ *</label><select name="bayaa" required><option value="">اختر</option><option value="لا">لا</option><option value="نعم">نعم</option></select>
