<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عرش الخلافة - عودة طنجة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{background:#0a0e2a;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top-bar{background:#131a3a;border-radius:0 0 20px 20px;padding:10px 12px;display:flex;justify-content:space-around;align-items:center;font-size:14px;font-weight:900}
  .map{flex:1;background:radial-gradient(circle at center,#1a2a6a,#0a1430);position:relative;padding:10px}
  .city{position:absolute;width:95px;height:95px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid;cursor:pointer;box-shadow:0 0 15px}
  .c-tangier{top:8%;left:8%;background:radial-gradient(#2eff7a22,#0a4a1a);border-color:#2eff7a;box-shadow:0 0 20px #2eff7a}
  .c-ceuta{top:8%;right:8%;background:radial-gradient(#ff4a4a22,#4a0a0a);border-color:#ff4a4a}
  .c-toledo{top:35%;left:4%;background:#ff9f1c33;border-color:#ff9f1c}
  .c-strait{top:35%;right:4%;background:#33d9ff33;border-color:#33d9ff}
  .c-seville{top:53%;left:4%;background:#ff9f1c33;border-color:#ff9f1c}
  .c-granada{top:75%;left:10%;background:#ff9f1c33;border-color:#ff9f1c}
  .c-cordoba{top:75%;right:10%;background:#ff9f1c33;border-color:#ff9f1c}
  .center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:175px;height:125px;background:linear-gradient(#ffcc33,#ff9900);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #cc7700,0 0 25px #ffcc33aa;cursor:pointer;color:#3d2200;font-weight:900}
  .bottom{background:#0f1535;border-radius:20px 20px 0 0;padding:10px}
  .hint{text-align:center;color:#8ab4ff;font-size:13px;margin-bottom:8px}
  .stats{background:#0a0e2a;border-radius:12px;display:flex;justify-content:space-around;padding:8px;font-size:13px;font-weight:900;margin-bottom:8px}
  .actions{display:flex;gap:8px}
  .act{flex:1;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;cursor:pointer}
  .act-red{background:linear-gradient(#ff6b6b,#cc3333);color:white}
  .act-green{background:linear-gradient(#6bff8a,#22aa44);color:white}
  .act-yellow{background:linear-gradient(#ffe066,#ffaa00);color:#3d2200}
</style>
</head>
<body>
  <div class="top-bar"><span>🏰 1/8</span><span>🌾 300</span><span>🪨 400</span><span>🪵 500</span><span>🪙 800</span></div>
  <div class="map">
    <div class="city c-tangier" onclick="enterCity('طنجة')"><div style="font-size:38px">🏰</div><div>Tangier</div></div>
    <div class="city c-ceuta" onclick="alert('سبتة تحت حصار العدو!')"><div style="font-size:38px">🏰</div><div>Ceuta</div></div>
    <div class="city c-toledo" onclick="alert('طليطلة مقفولة')"><div style="font-size:38px">🏰</div><div>Toledo</div></div>
    <div class="city c-strait"><div style="font-size:38px">🌊</div><div>Strait</div></div>
    <div class="city c-seville"><div style="font-size:38px">🏰</div><div>Seville</div></div>
    <div class="city c-granada"><div style="font-size:38px">🕌</div><div>Granada</div></div>
    <div class="city c-cordoba"><div style="font-size:38px">🕌</div><div>Cordoba</div></div>
    <div class="center-btn" onclick="enterCity('طنجة')"><div style="font-size:42px">🏰</div><div style="font-size:22px">دخول القلعة</div></div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint">اختر مدينة للتحرك أو اجمع الموارد قبل الدخول</div>
    <div class="stats"><span>⭐ المستوى: 7</span><span>💎 النقاط: 1240</span><span>🪖 الجنود: 42</span></div>
    <div class="actions">
      <div class="act act-red" onclick="alert('مطاردة بدأت!')"><span>مطاردة</span></div>
      <div class="act act-green" onclick="collect()"><span>جمع</span></div>
      <div class="act act-yellow" onclick="enterCity('طنجة')"><span>دخول القلعة</span></div>
    </div>
  </div>
<script>
  let res={wheat:300,gold:800}
  function collect(){res.wheat+=50;res.gold+=20;document.getElementById('hint').innerText='تم الجمع +50 قمح +20 ذهب! 🌾💰';}
  function enterCity(n){alert('🏰 مرحبا بك في قلعة '+n+' - المسنطحة رجعات! 😎');}
</script>
</body>
</html>
