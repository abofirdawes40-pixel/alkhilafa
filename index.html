<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>عرش الخلافة - المدينة الكاملة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo'}
body{background:#0a1430;overflow:hidden;height:100vh;display:flex;flex-direction:column;color:#fff}
#top{padding:6px 10px;background:#111a3a;display:flex;justify-content:space-between;font-size:11px;z-index:20}
#canvas{flex:1;position:relative}
#bottom{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0a1430 50%);padding:8px;z-index:20}
.stats{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.stat{background:#1a2a5aee;padding:4px 10px;border-radius:20px;font-size:10px;border:1px solid #fff2}
.controls{display:flex;gap:5px}
.btn{flex:1;padding:12px 3px;border-radius:12px;text-align:center;font-weight:900;font-size:12px;cursor:pointer;border:none}
#b1{background:linear-gradient(#ffcc33,#ff9900);color:#3d2200}#b2{background:linear-gradient(#22ff88,#1abb5a);color:#003311}#b3{background:linear-gradient(#ff5555,#cc2222);color:#fff}
#cityInfo{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#000c;padding:5px 12px;border-radius:20px;font-size:10px;z-index:15;text-align:center;max-width:90%}
#interiorUI{position:absolute;top:0;left:0;right:0;bottom:0;background:#0a1430;z-index:30;display:none;flex-direction:column}
#intTop{padding:8px;background:#111a3a;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.buildings{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:12px}
.sectionTitle{background:#ffcc3322;padding:6px 12px;border-radius:10px;font-weight:900;font-size:12px;border-right:4px solid #ffcc33;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.building{background:#1a2a5a;border-radius:14px;padding:10px;text-align:center;border:2px solid #ffffff11;cursor:pointer;position:relative}
.building:active{transform:scale(0.95)}
.building .icon{font-size:28px}.building .name{font-weight:900;font-size:11px;margin:3px 0}.building .lvl{font-size:10px;color:#ffcc33}.building .cost{font-size:9px;color:#88ff88;margin-top:2px}
.count{position:absolute;top:4px;left:4px;background:#ff4444;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px}
.field{background:linear-gradient(#2a4a1a,#1a3a0a) !important;border-color:#55aa33 !important}
.fieldWood{background:linear-gradient(#4a2a0a,#3a1a00) !important;border-color:#aa773
