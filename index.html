<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرش الخلافة</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1931;color:#fff;font-family:Tahoma;padding-bottom:90px}.top{position:fixed;top:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;justify-content:space-around;font-weight:700;z-index:100;border-bottom:3px solid gold;font-size:13px}.map{margin-top:55px;width:100%;height:62vh;background:radial-gradient(circle,#1e3a8a,#0a1931);position:relative;border-bottom:3px solid gold}.city{position:absolute;width:85px;height:85px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:3px solid #fff;box-shadow:0 0 15px gold;font-size:13px}.c-green{background:#22c55e;left:6%;top:10%}.c-red1{background:#ef4444;left:42%;top:14%}.c-orange1{background:#f97316;left:72%;top:22%}.c-cyan{background:#06b6d4;left:22%;top:33%}.c-red2{background:#ef4444;left:54%;top:42%}.c-orange2{background:#f97316;left:6%;top:50%}.c-orange3{background:#f97316;left:70%;top:62%}.c-orange4{background:#f97316;left:20%;top:75%}.enter{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:linear-gradient(gold,#f59e0b);color:#000;padding:16px 30px;border-radius:25px;font-weight:700;font-size:20px;border:4px solid #fff;z-index:2000;box-shadow:0 0 30px gold;animation:pulse 1s infinite}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}.inside{position:fixed;inset:0;background:#0f172a;z-index:5000;display:none;overflow-y:auto;padding:10px;padding-bottom:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.b{background:#1e293b;border:2px solid #475569;border-radius:12px;padding:10px;text-align:center;position:relative}.b.built{border-color:gold;background:#2a3a52}.b-lvl{position:absolute;top:5px;left:5px;background:gold;color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.b-icon{font-size:28px}.b-name{font-weight:700;font-size:12px;margin:4px 0}.b-desc{font-size:9px;color:#94a3b8}.b-cost{font-size:10px;color:#fbbf24;margin:3px 0}.b-btn{padding:7px;border:none;border-radius:12px;font-weight:700;color:#fff;width:100%;margin-top:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:10px;border-top:3px solid gold;z-index:100;text-align:center}</style></head><body><div class="top"><span>💰 <b id="gold">800</b></span><span>🪵 <b id="wood">500</b></span><span>🪨 <b id="stone">400</b></span><span>🌾 <b id="food">300</b></span><span>🏰 <b id="cnt">1/8</b></span></div><div class="map"><div class="city c-green">طنجة<br>🏰</div><div class="city c-red1">سبتة</div><div class="city c-orange1">طليطلة</div><div class="city c-cyan">المضيق</div><div class="city c-red2">طريف</div><div class="city c-orange2">إشبيلية</div><div class="city c-orange3">غرناطة</div><div class="city c-orange4">قرطبة</div></div><button class="enter" id="enterBtn" onclick="openInside()">🏰 دخول القلعة</button><div class="inside" id="inside"><div style="display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:12px;border-radius:12px;border:2px solid gold"><h3 style="margin:0">🏰 طنجة - داخل القلعة</h3><button onclick="closeInside()" style="background:#ef4444;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700">×</button></div><div class="grid" id="grid"></div><div style="margin-top:12px;background:#1e293b;padding:10px;border-radius:10px;font-size:12px;border:1px solid gold">📊 <b>إنتاج:</b> <span id="prod"></span><br>🛡️ <b>دفاع:</b> <span id="def"></span> | 🏹 <b>جنود:</b> <span id="sold2"></span></div><div style="margin-top:10px;display:flex;gap:8px"><button onclick="collect()" style="flex:1;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-weight:700">💰 جمع الموارد</button><button onclick="closeInside()" style="flex:1;padding:12px;background:#475569;color:#fff;border:none;border-radius:12px;font-weight:700">🗺️ الخريطة</button></div></div><div class="bottom"><div style="font-size:13px;font-weight:700;color:#fbbf24" id="msg">👆 برك على زر دخول القلعة الأصفر!</div><div style="display:flex;justify-content:space-around;margin:8px 0;font-size:12px;color:#fbbf24"><span>⚔️ جنود: <b id="sold">50</b></span><span>⭐ نقاط: <b id="pts">0</b></span><span>📈 مستوى: <b id="lvl">1</b></span></div><div style="display:flex;gap:8px;justify-content:center"><button onclick="openInside()" style="padding:10px 18px;border:none;border-radius:20px;background:linear-gradient(gold,orange);color:#000;font-weight:700;font-size:14px">🏰 دخول القلعة</button><button onclick="collect()" style="padding:10px 18px;border:none;border-radius:20px;background:#22c55e;color:#fff;font-weight:700">💰 جمع</button><button onclick="alert('🎯 قريبا')" style="padding:10px 18px;border:none;border-radius:20px;background:#ef4444;color:#fff;font-weight:700">🎯 مطاردة</button></div></div><script>let R={gold:800,wood:500,stone:400,food:300,sold:50,pts:0};let city={lvl:1,b:{qasr:1,masjid:1}};const BUILD=[{id:'qasr',n:'دار الإمارة',ic:'🏛️',d:'قلب القلعة',c:{g:0,w:0,s:0},p:{},m:10},{id:'masjid',n:'المسجد',ic:'🕌',d:'+5 جنود/ساعة',c:{g:60,w:40,s:30},p:{sold:5},m:10},{id:'thakana',n:'الثكنة',ic:'🏹',d:'+20 جندي',c:{g:100,w:80,s:50},p:{sold:20},m:10},{id:'sour',n:'السور',ic:'🧱',d:'+500 دفاع',c:{g:80,w:20,s:100},p:{def:500},m:10},{id:'borj',n:'البرج',ic:'🗼',d:'+300 دفاع',c:{g:120,w:60,s:80},p:{def:300},m:10},{id:'mazraa',n:'المزرعة',ic:'🌾',d:'+50 طعام',c:{g:50,w:60,s:20},p:{food:50},m:10},{id:'manjam',n:'المنجم',ic:'⛏️',d:'+40 حجر',c:{g:70,w:30,s:20},p:{stone:40},m:10},{id:'mashjara',n:'المنشرة',ic:'🪓',d:'+40 خشب',c:{g:60,w:20,s:30},p:{wood:40},m:10},{id:'souq',n:'السوق',ic:'🛒',d:'+30 ذهب',c:{g:80,w:50,s:40},p:{gold:30},m:10},{id:'makhzan',n:'المخزن',ic:'🏚️',d:'+500 سعة',c:{g:40,w:80,s:60},p:{},m:10},{id:'istabl',n:'الإسطبل',ic:'🐎',d:'+15 فرسان',c:{g:150,w:70,s:50},p:{sold:15},m:10},{id:'mahad',n:'المدرسة',ic:'📚',d:'فتح أبحاث',c:{g:200,w:100,s:100},p:{},m:5}];function update(){document.getElementById('gold').innerText=R.gold;document.getElementById('wood').innerText=R.wood;document.getElementById('stone').innerText=R.stone;document.getElementById('food').innerText=R.food;document.getElementById('sold').innerText=R.sold;document.getElementById('pts').innerText=R.pts;}function openInside(){document.getElementById('inside').style.display='block';document.getElementById('enterBtn').style.display='none';draw();}function closeInside(){document.getElementById('inside').style.display='none';document.getElementById('enterBtn').style.display='block';}function draw(){let grid=document.getElementById('grid');grid.innerHTML='';BUILD.forEach(function(b){let lvl=city.b[b.id]||0;let cg=Math.floor(b.c.g*(lvl?lvl*1.5:1));let cw=Math.floor(b.c.w*(lvl?lvl*1.5:1));let cs=Math.floor(b.c.s*(lvl?lvl*1.5:1));let div=document.createElement('div');div.className='b '+(lvl>0?'built':'');let btnText=lvl==0?'بناء':'ترقية '+(lvl+1);if(lvl>=b.m) btnText='MAX';let costText=lvl>=b.m?'MAX':'💰'+cg+' 🪵'+cw+' 🪨'+cs;let btnColor=lvl==0?'#22c55e':lvl>=b.m?'#334155':'#f59e0b';div.innerHTML='<div class=b-lvl>'+lvl+'</div><div class=b-icon>'+b.ic+'</div><div class=b-name>'+b.n+'</div><div class=b-desc>'+b.d+'</div><div class=b-cost>'+costText+'</div><button class=b-btn style=background:'+btnColor+' onclick=buildIt(\''+b.id+'\')>'+btnText+'</button>';grid.appendChild(div);});let prod={gold:0,wood:0,stone:0,food:0,sold:0,def:0};for(let id in city.b){let lvl=city.b[id];let bb=BUILD.find(function(x){return x.id==id});if(!bb) continue;if(bb.p.gold) prod.gold+=bb.p.gold*lvl;if(bb.p.wood) prod.wood+=bb.p.wood*lvl;if(bb.p.stone) prod.stone+=bb.p.stone*lvl;if(bb.p.food) prod.food+=bb.p.food*lvl;if(bb.p.sold) prod.sold+=bb.p.sold*lvl;if(bb.p.def) prod.def+=bb.p.def*lvl;}document.getElementById('prod').innerText='💰'+prod.gold+' 🪵'+prod.wood+' 🪨'+prod.stone+' 🌾'+prod.food;document.getElementById('def').innerText=prod.def;document.getElementById('sold2').innerText=prod.sold;document.getElementById('lvl').innerText=city.lvl;document.getElementById('sold').innerText=R.sold+prod.sold;}function buildIt(id){let lvl=city.b[id]||0;let b=BUILD.find(function(x){return x.id==id});let cg=Math.floor(b.c.g*(lvl?lvl*1.5:1));let cw=Math.floor(b.c.w*(lvl?lvl*1.5:1));let cs=Math.floor(b.c.s*(lvl?lvl*1.5:1));if(lvl>=b.m){alert('MAX');return;}if(R.gold>=cg&&R.wood>=cw&&R.stone>=cs){R.gold-=cg;R.wood-=cw;R.stone-=cs;city.b[id]=lvl+1;if(id=='qasr') city.lvl=lvl+1;R.pts+=(lvl+1)*5;update();draw();document.getElementById('msg').innerText='⬆️ '+b.n+' مستوى '+(lvl+1);}else{alert('❌ خاصك: '+cg+' ذهب '+cw+' خشب '+cs+' حجر');}}function collect(){let tot={gold:0,wood:0,stone:0,food:0,sold:0};for(let id in city.b){let lvl=city.b[id];let bb=BUILD.find(function(x){return x.id==id});if(bb.p.gold) tot.gold+=bb.p.gold*lvl;if(bb.p.wood) tot.wood+=bb.p.wood*lvl;if(bb.p.stone) tot.stone+=bb.p.stone*lvl;if(bb.p.food) tot.food+=bb.p.food*lvl;if(bb.p.sold) tot.sold+=bb.p.sold*lvl;}R.gold+=tot.gold;R.wood+=tot.wood;R.stone+=tot.stone;R.food+=tot.food;R.sold+=tot.sold;update();document.getElementById('msg').innerText='💰 جمعت: '+tot.gold+' ذهب '+tot.wood+' خشب';}update();</script></body></html>
