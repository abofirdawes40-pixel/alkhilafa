<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عرش الخلافة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a1430;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
.map{position:relative;width:100%;max-width:400px;height:520px;background:radial-gradient(#1a2a6a,#0a1430);border-radius:20px;margin:10px 0}
.city{position:absolute;width:110px;height:110px;border-radius:50%;background:#1e2a5a;display:flex;flex-direction:column;justify-content:center;align-items:center;border:4px solid;cursor:pointer}
.city.active{border-color:#00ff88;box-shadow:0 0 20px #00ff88}
.city.enemy{border-color:#ff4444}.city.neutral{border-color:#ffaa00}.city.strait{border-color:#44ddff}
#tangier{top:10px;left:10px}#ceuta{top:10px;right:10px}#toledo{top:150px;left:10px}#strait{top:170px;right:10px}
#seville{top:280px;left:10px}#granada{bottom:10px;left:30px}#cordoba{bottom:10px;right:30px}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:120px;background:linear-gradient(#ffcc33,#ff9900);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#3d2200;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 5px 0 #aa6600}
.stats{background:#111a3a;width:100%;max-width:400px;padding:12px;border-radius:15px;display:flex;justify-content:space-around;margin:10px 0;font-size:13px}
.controls{display:flex;gap:8px;width:100%;max-width:400px}
.btn{flex:1;padding:16px;border-radius:15px;text-align:center;font-weight:900;cursor:pointer;font-size:16px}
#b1{background:linear-gradient(#ffcc33,#ff9900);color:#3d2200}#b2{background:linear-gradient(#22ff88,#22aa44)}#b3{background:linear-gradient(#ff5555,#cc2222)}
#online{margin:5px;color:#22ff88;font-size:13px}
</style>
</head>
<body>
<div id="online">🟢 عرش الخلافة - متصل: 1 - 🟢 خدامة 100%</div>
<div class="map">
<div id="tangier" class="city active" onclick="selectCity('Tangier')">🏰<br>Tangier</div>
<div id="ceuta" class="city enemy" onclick="selectCity('Ceuta')">🏰<br>Ceuta</div>
<div id="toledo" class="city neutral" onclick="selectCity('Toledo')">🏰<br>Toledo</div>
<div id="strait" class="city strait" onclick="selectCity('Strait')">🌊<br>Strait</div>
<div id="seville" class="city neutral" onclick="selectCity('Seville')">🏰<br>Seville</div>
<div id="granada" class="city neutral" onclick="selectCity('Granada')">🕌<br>Granada</div>
<div id="cordoba" class="city neutral" onclick="selectCity('Cordoba')">🕌<br>Cordoba</div>
<div class="center" onclick="enterCastle()">🏰<br>دخول القلعة</div>
</div>
<p style="color:#88aaff;font-size:13px;margin:5px">اختر مدينة للتحرك أو اجمع الموارد قبل الدخول</p>
<div class="stats"><span>⭐ المستوى: <b id="lvl">7</b></span><span>💎 النقاط: <b id="pts">1240</b></span><span>🪖 الجنود: <b id="sold">42</b></span></div>
<div class="controls"><div id="b1" class="btn" onclick="enterCastle()">دخول<br>القلعة</div><div id="b2" class="btn" onclick="collect()">جمع</div><div id="b3" class="btn" onclick="chase()">مطاردة</div></div>

<script>
let current='Tangier';
let points=1240, soldiers=42, level=7;
function selectCity(name){ current=name; document.querySelectorAll('.city').forEach(c=>c.classList.remove('active')); event.currentTarget.classList.add('active'); alert('تم اختيار: '+name+'\nدابا تقدر تدير مطاردة أو دخول القلعة!'); }
function enterCastle(){ points+=50; document.getElementById('pts').innerText=points; alert('🏰 دخلت لقلعة '+current+'!\n+50 نقطة!\nالنقاط ديالك: '+points); }
function collect(){ points+=20; soldiers+=2; document.getElementById('pts').innerText=points; document.getElementById('sold').innerText=soldiers; alert('💎 جمعت الموارد من '+current+'!\n+20 نقطة و +2 جنود'); }
function chase(){ if(soldiers<5){ alert('❌ ما عندكش جنود كافيين! جمع الموارد أولا'); return; } soldiers-=5; points+=100; level++; document.getElementById('sold').innerText=soldiers; document.getElementById('pts').innerText=points; document.getElementById('lvl').innerText=level; alert('⚔️ مطاردة ناجحة من '+current+' إلى سبتة!\nربحتي 100 نقطة!\nالمستوى ديالك ولا: '+level); }
</script>
</body>
</html>
