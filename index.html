<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرش الخلافة</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;text-align:center}#map{width:100vw;height:65vh;background:linear-gradient(#38bdf8,#1e3a8a);position:relative;border:3px solid #fbbf24}.city{position:absolute;width:80px;height:80px;background:#fbbf24;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;cursor:pointer}#hud{background:#1e293b;padding:15px;display:flex;justify-content:space-around}button{background:#fbbf24;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;margin:5px}#log{height:15vh;overflow:auto;background:#020617;padding:10px;text-align:right}</style></head><body><div id="hud"><span>⚔️ جيشك: <b id="army">100</b></span><span>💰 ذهب: <b id="gold">500</b></span><span>🏰 قرطبة</span></div><h2>🗺️ خريطة الأندلس</h2><div id="map"><div class="city" style="top:20%;left:30%" onclick="attack('إشبيلية')">إشبيلية</div><div class="city" style="top:45%;left:55%" onclick="attack('غرناطة')">غرناطة</div><div class="city" style="top:60%;left:25%" onclick="attack('قرطبة')">قرطبة</div><div class="city" style="top:15%;left:60%" onclick="attack('طليطلة')">طليطلة</div></div><div id="log">مرحبا يا خليفة! اضغط مدينة لتهاجمها...</div><div style="padding:10px"><button onclick="recruit()">➕ جند جنود (50 ذهب)</button></div><script>let army=100,gold=500;function log(t){document.getElementById('log').innerHTML='<div>'+t+'</div>'+document.getElementById('log').innerHTML}function attack(c){if(army<10){log('❌ جيشك ضعيف!');return}army-=10;gold+=Math.floor(Math.random()*100+20);document.getElementById('army').innerText=army;document.getElementById('gold').innerText=gold;log('⚔️ هاجمت '+c+' وربحت!')}function recruit(){if(gold<50){log('❌ لا يوجد ذهب');return}gold-=50;army+=20;document.getElementById('army').innerText=army;document.getElementById('gold').innerText=gold;log('✅ جندت 20 جندي')}</script></body></html>
