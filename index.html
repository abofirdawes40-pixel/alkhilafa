<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>عرش الخلافة</title><style>body{margin:0;background:#0a1931;color:#fff;font-family:Tahoma;height:100vh;overflow:hidden}.map{position:relative;width:100%;height:65vh;background:radial-gradient(circle,#1e3a8a,#0a1931)}.city{position:absolute;width:82px;height:82px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 0 10px gold;border:3px solid #fff;font-size:13px}.city.green{background:#22c55e;border-color:gold}.city.red{background:#ef4444}.city.cyan{background:#22d3ee}.city.orange{background:#f97316}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:6px;border-top:3px solid gold;text-align:center;z-index:50}.camp{position:absolute;width:62px;height:62px;background:radial-gradient(red,darkred);border-radius:50%;border:3px solid yellow;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;z-index:999;cursor:pointer;animation:pulse 0.8s infinite;color:#fff;font-weight:bold}.castle-ev{position:absolute;width:70px;height:70px;background:radial-gradient(#7c2d12,#000);border-radius:15px;border:3px solid gold;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;z-index:998;cursor:pointer;animation:pulse 1s infinite;color:gold;font-weight:bold}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}.evBar{display:flex;gap:8px;justify-content:center;margin-top:5px}.evBtn{padding:8px 14px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;color:#fff;font-size:13px}</style></head><body><div class="map" id="map"><div class="city green" style="left:5%;top:12%">طنجة<br>🏰</div><div class="city red" style="left:42%;top:15%">سبتة</div><div class="city cyan" style="left:22%;top:32%">المضيق</div><div class="city red" style="left:52%;top:38%">طريف</div><div class="city orange" style="left:5%;top:48%">إشبيلية</div><div class="city orange" style="left:72%;top:22%">طليطلة</div><div class="city orange" style="left:68%;top:58%">غرناطة</div><div class="city orange" style="left:18%;top:72%">قرطبة</div><div id="evLayer"></div></div><div class="bottom"><div style="font-size:13px">🏴 بسم الله! أنت في طنجة. ابدأ بفتح سبتة والمضيق!</div><div style="color:#fbbf24;font-weight:bold;margin:3px 0;font-size:14px">ذهب: <span id="gold">300</span> | جنود:30 | فتح:1/8 | نقاط: <span id="pts">0</span></div><div class="evBar"><button class="evBtn" style="background:linear-gradient(orange,red)" onclick="startHunt()">🎯 مطاردة</button><button class="evBtn" style="background:linear-gradient(#7c2d12,orange)" onclick="startHorde()">🏰 حشود</button><button class="evBtn" style="background:#334155" onclick="clearEv()">🧹 مسح</button></div><div id="rank" style="font-size:12px;color:#fbbf24;margin-top:3px">الترتيب: -</div></div><script>let gold=300,pts=0;let g=document.getElementById('gold'),p=document.getElementById('pts'),r=document.getElementById('rank'),layer=document.getElementById('evLayer');function startHunt(){clearEv();let power=1000,level=1;alert('🎯 مطاردة بدأت! مستوى 1 قوة 1000');function spawn(){let c=document.createElement('div');c.className='camp';c.style.left=(Math.random()*70+10)+'%;';c.style.top=(Math.random()*50+10)+'%;';c.innerHTML='⛺<small>'+power+'</small>';c.onclick=function(){power-=300;gold+=10;pts+=10;g.innerText=gold;p.innerText=pts;if(power<=0){this.remove();if(level==1){gold+=50;g.innerText=gold;alert('🥇 الضربة الأولى! +50');}level++;r.innerHTML='المستوى: '+level+'/10 - ترتيب: '+(51-level);if(level<=10){power=1000*level;spawn();}else{alert('🏆 انتهى! Top 50 فردي و Top 3 تحالف');r.innerHTML='🏆 انتهى - Top 50 + Top 3';}}else{this.innerHTML='⛺<small>'+power+'</small>';}};layer.appendChild(c);}spawn();}function startHorde(){clearEv();alert('🏰 حملة الحشود! 10 قلاع');let forts=10;for(let i=1;i<=10;i++){setTimeout(()=>{let c=document.createElement('div');c.className='castle-ev';c.style.left=(Math.random()*75+5)+'%;';c.style.top=(Math.random()*50+5)+'%;';let pw=1000*i;c.innerHTML='🏰<small style="font-size:10px">'+pw+'</small>';c.onclick=function(){pw-=300;if(pw<=0){this.remove();forts--;gold+=i*20;pts+=i*15;g.innerText=gold;p.innerText=pts;r.innerHTML='قلاع باقية: '+forts+' | نقاط: '+pts;if(forts==0){alert('🏆 انتهت الحملة! نقاط: '+pts+'\nTop 50 فردي + Top 3 تحالف');r.innerHTML='🏆 انتهت! نقاط: '+pts;}}else{this.innerHTML='🏰<small>'+pw+'</small>';}};layer.appendChild(c);},i*400);}}function clearEv(){layer.innerHTML='';r.innerHTML='الترتيب: -';}</script></body></html>
