<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الخلافة V2 - من طنجة للأندلس</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#06101f;color:#fff;font-family:'Amiri',sans-serif;overflow:hidden}
#map{position:relative;width:100vw;height:65vh;background:radial-gradient(ellipse at top,#1e5fad 0%,#0a2a5a 60%,#061a3a 100%);border-bottom:4px solid #f1c40f;overflow:hidden}
.sea{position:absolute;width:100%;height:18%;top:32%;background:rgba(0,200,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;color:#7ed6df;letter-spacing:2px}
.city{position:absolute;width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;border:3px solid #fff;text-align:center;font-size:13px;box-shadow:0 0 15px rgba(255,211,42,0.6);transition:0.3s;z-index:2}
.city:active{transform:scale(0.9)}
.city.conquered{background:radial-gradient(#26de81,#20bf6b)!important;color:#fff!important;border-color:gold;box-shadow:0 0 20px #26de81}
#tanja{top:6%;left:5%;width:88px;height:88px;background:radial-gradient(#ff6b6b,#c0392b);border-color:gold;animation:pulse 2s infinite}
#sebt{top:8%;left:38%;width:68px;height:68px;background:radial-gradient(#f8c291,#e55039);font-size:12px}
#mdiq{top:22%;left:22%;width:68px;height:68px;background:radial-gradient(#7ed6df,#22a6b3)}
#tarif{top:28%;left:48%;width:62px;height:62px;background:radial-gradient(#e77f67,#b71540);font-size:11px}
#tulaytula{top:14%;right:6%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}
#ishbiliya{top:32%;left:5%;width:70px;height:70px;background:radial-gradient(#ffa502,#ff6348);color:#000}
#qurtuba{bottom:22%;left:18%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}
#gharnata{bottom:38%;right:10%;width:70px;height:70px;background:radial-gradient(#ffd32a,#e67e22);color:#000}
@keyframes pulse{0%{box-shadow:0 0 0 0 gold}70%{box-shadow:0 0 0 15px rgba(255,215,0,0)}100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}}
#hero{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid gold;z-index:3}
#log{height:18vh;background:#0f172a;padding:8px 10px;overflow-y:auto;font-size:13px;line-height:1.7;border-top:2px solid #1e293b}
#controls{height:17vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1e293b;gap:6px}
#stats{display:flex;gap:10px;color:#f1c40f;font-weight:bold;font-size:13px;flex-wrap:wrap;justify-content:center}
