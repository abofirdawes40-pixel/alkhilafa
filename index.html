<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قلعة طارق 2.5D - كاملة</title><style>body{margin:0;background:#050a05;color:#fff;font-family:Cairo;padding:10px}h2{text-align:center;color:#7aff7a;padding:10px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:0 auto} .card{background:linear-gradient(145deg,#1c3320,#0e1f10);border:2px solid #2e5a2e;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s} .card:hover{border-color:#7aff7a;transform:translateY(-3px)} .card.main{grid-column:span 2} .card img{width:100%;height:160px;object-fit:cover;background:#0a1a0a} .card.main img{height:220px} .info{padding:10px;text-align:center} .name{font-size:12px;font-weight:900;color:#c8f0c8} .lvl{background:linear-gradient(90deg,#2e8b57,#1a7a1a);color:#fff;font-size:9px;padding:2px 8px;border-radius:20px;border:1px solid #7aff7a} .btn{width:100%;margin-top:6px;padding:8px;background:linear-gradient(90deg,#2e8b57,#1a7a1a);color:#fff;border:1px solid #7aff7a;border-radius:10px;font-weight:900;font-size:11px}</style></head><body>
<h2>🏰 قلعة طارق بن زياد 2.5D 🏰</h2>
<div class="grid">
<div class="card main" onclick="alert('🕌 قصر الخلافة Lv24 - قلب الدولة!')"><img src="castle.jpg"><div class="info"><div class="name">🕌 قصر الخلافة</div><span class="lvl">Lv24</span><button class="btn">⬆️ ترقية الآن</button></div></div>
<div class="card" onclick="alert('🛡️ الثكنة Lv20 - تدريب المجاهدين!')"><img src="barracks.jpg"><div class="info"><div class="name">🛡️ الثكنة</div><span class="lvl">Lv20</span><button class="btn">تدريب</button></div></div>
<div class="card" onclick="alert('📚 بيت الحكمة Lv19 - العلوم!')"><img src="library.jpg"><div class="info"><div class="name">📚 بيت الحكمة</div><span class="lvl">Lv19</span><button class="btn">بحث</button></div></div>
<div class="card" onclick="alert('🏪 السوق Lv18 - التجارة!')"><img src="souk.jpg"><div class="info"><div class="name">🏪 السوق</div><span class="lvl">Lv18</span><button class="btn">جمع</button></div></div>
<div class="card" onclick="alert('🏥 المارستان Lv17 - علاج الجنود!')"><img src="hospital.jpg"><div class="info"><div class="name">🏥 المارستان</div><span class="lvl">Lv17</span><button class="btn">علاج</button></div></div>
<div class="card" onclick="alert('🐴 الإسطبل Lv15 - الخيول العربية!')"><img src="stable.jpg"><div class="info"><div class="name">🐴 الإسطبل</div><span class="lvl">Lv15</span><button class="btn">تربية</button></div></div>
</div>
<p style="text-align:center;color:#7aff7a;margin-top:15px">✅ مدينة إسلامية 2.5D كاملة - طنجة 711م</p>
</body></html>
